<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Random-dot motion</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 8px;
         color: #243447; background: transparent; }
  .wrap { display: flex; gap: 14px; align-items: flex-start; }
  canvas { background: #111; border-radius: 50%; flex: 0 0 auto; }
  .controls { flex: 1 1 180px; font-size: 14px; }
  .group { margin-bottom: 12px; }
  .label { font-weight: 600; margin-bottom: 4px; }
  button { font: inherit; padding: 4px 9px; margin: 2px 2px 2px 0; border: 1px solid #467AAC;
           background: #fff; color: #467AAC; border-radius: 4px; cursor: pointer; }
  button.on { background: #467AAC; color: #fff; }
  .note { color: #555; font-size: 13px; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="dots" width="280" height="280" aria-label="Random-dot motion display"></canvas>
  <div class="controls">
    <div class="group">
      <div class="label">Coherence</div>
      <div id="coh"></div>
    </div>
    <div class="group">
      <div class="label">Direction</div>
      <button id="dir-left">&larr; left</button><button id="dir-right" class="on">right &rarr;</button>
    </div>
    <div class="group">
      <div class="label">Display</div>
      <button id="play" class="on">pause</button>
      <button id="reveal">show coherent dots</button>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var canvas = document.getElementById("dots");
  var ctx = canvas.getContext("2d");
  var R = canvas.width / 2;          // aperture radius in pixels
  var nDots = 150;
  var speed = 3;                     // pixels per frame
  var levels = [0, 0.064, 0.128, 0.256, 0.512, 1];
  var coherence = parseFloat(params.get("coherence") || "0.256");
  var direction = params.get("direction") === "left" ? -1 : 1;
  var playing = true, reveal = false;
  var dots = [];

  function randomPoint() {           // uniform position inside the circle
    var r = (R - 3) * Math.sqrt(Math.random()), th = 2 * Math.PI * Math.random();
    return { x: R + r * Math.cos(th), y: R + r * Math.sin(th) };
  }
  for (var i = 0; i < nDots; i++) { var p = randomPoint(); dots.push({ x: p.x, y: p.y, coherent: false }); }

  function inside(d) { var dx = d.x - R, dy = d.y - R; return dx * dx + dy * dy < (R - 3) * (R - 3); }

  function step() {
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      // On every frame each dot is coherent with probability = coherence.
      d.coherent = Math.random() < coherence;
      if (d.coherent) {
        d.x += direction * speed;
        if (!inside(d)) {            // re-enter on the opposite side
          d.x -= direction * 2 * Math.sqrt(Math.max(0, (R - 3) * (R - 3) - (d.y - R) * (d.y - R)));
          if (!inside(d)) { var p = randomPoint(); d.x = p.x; d.y = p.y; }
        }
      } else {                       // noise dots jump to a random position
        var q = randomPoint(); d.x = q.x; d.y = q.y;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(R, R, R, 0, 2 * Math.PI); ctx.fill();
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      ctx.fillStyle = reveal && d.coherent ? "#5fa8ff" : "#f2f2f2";
      ctx.fillRect(d.x - 1.5, d.y - 1.5, 3, 3);
    }
    ctx.fillStyle = "#e74c3c";        // fixation point
    ctx.fillRect(R - 2, R - 2, 4, 4);
  }

  var last = 0;
  function loop(ts) {
    if (playing && ts - last > 1000 / 30) { step(); draw(); last = ts; }
    requestAnimationFrame(loop);
  }

  function updateNote() {
    var pct = Math.round(coherence * 1000) / 10;
    var n = Math.round(coherence * nDots);
    document.getElementById("note").innerHTML =
      "At " + pct + "% coherence, about " + n + " of the " + nDots +
      " dots move " + (direction > 0 ? "right" : "left") + " on each frame; the rest jump to random places." +
      (coherence === 0 ? " There is no coherent motion at all." : "");
  }

  var cohDiv = document.getElementById("coh");
  levels.forEach(function (c) {
    var b = document.createElement("button");
    b.textContent = (Math.round(c * 1000) / 10) + "%";
    if (Math.abs(c - coherence) < 1e-9) b.className = "on";
    b.onclick = function () {
      coherence = c;
      Array.prototype.forEach.call(cohDiv.children, function (x) { x.className = ""; });
      b.className = "on"; updateNote();
    };
    cohDiv.appendChild(b);
  });
  document.getElementById("dir-left").onclick = function () {
    direction = -1; this.className = "on"; document.getElementById("dir-right").className = ""; updateNote();
  };
  document.getElementById("dir-right").onclick = function () {
    direction = 1; this.className = "on"; document.getElementById("dir-left").className = ""; updateNote();
  };
  document.getElementById("play").onclick = function () {
    playing = !playing; this.textContent = playing ? "pause" : "play"; this.className = playing ? "on" : "";
  };
  document.getElementById("reveal").onclick = function () {
    reveal = !reveal; this.className = reveal ? "on" : ""; draw();
  };

  if (params.get("reveal") === "1") { reveal = true; document.getElementById("reveal").className = "on"; }
  updateNote(); step(); draw(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
